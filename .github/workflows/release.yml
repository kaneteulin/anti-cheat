# v로 시작하는 태그(v0.1.0 등)를 푸시하면 플러그인을 빌드해서 GitHub Releases에 올린다.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_VERSION: "26.3"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare Paper server (for NMS classes)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $Headers = @{ "User-Agent" = "anticheat-ci/1.0" }
          $Build = Invoke-RestMethod "https://fill.papermc.io/v3/projects/paper/versions/$env:MC_VERSION/builds/latest" -Headers $Headers
          New-Item -ItemType Directory -Force .server | Out-Null
          Invoke-WebRequest $Build.downloads.'server:default'.url -OutFile .server\paper.jar -UseBasicParsing -Headers $Headers

          Push-Location .server
          cmd /c "java -Dpaperclip.patchonly=true -jar paper.jar"
          Pop-Location
          if (!(Test-Path ".server\versions\$env:MC_VERSION")) { throw "paperclip did not produce versions\$env:MC_VERSION" }

      - name: Build plugin
        shell: powershell
        run: |
          # 태그 이름(v0.1.0)을 플러그인 버전(0.1.0)으로 사용. 태그 없이 수동 실행하면 "dev"
          $PluginVersion = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev" }
          powershell -NoProfile -ExecutionPolicy Bypass -File anti-cheat\build.ps1 -ServerDir .server -McVersion $env:MC_VERSION -PluginVersion $PluginVersion
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            anti-cheat/build/AntiCheat.jar
